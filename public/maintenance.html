<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Economic Bomb — Maintenance</title>
<link rel="icon" type="image/png" href="economicbomb.webp">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0e0e10;
  --surface: #18181b;
  --border: #27272a;
  --text: #fafafa;
  --muted: #71717a;
  --subtle: #3f3f46;
  --accent: #eab308;
  --accent-dim: rgba(234,179,8,0.12);
  --red: #ef4444;
  --green: #22c55e;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a { text-decoration: none; color: inherit; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  background: rgba(14,14,16,0.8);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em;
}
.logo img { height: 28px; width: 28px; object-fit: contain; border-radius: 4px; }

main {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 6rem 1.5rem 4rem;
  text-align: center;
}

.wrap { max-width: 480px; width: 100%; }

.eyebrow {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 100px; padding: 0.3rem 0.9rem;
  margin-bottom: 2rem;
}
.pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

h1 {
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 600; letter-spacing: -0.04em; line-height: 1.05;
  margin-bottom: 1rem;
}
h1 em { font-style: normal; color: var(--accent); }

.sub {
  font-size: 0.9rem; color: var(--muted);
  line-height: 1.7; margin-bottom: 2.5rem;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
  text-align: left;
  margin-bottom: 2rem;
}
.panel-label {
  font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 0.75rem;
}
.input-row { display: flex; gap: 0.5rem; }

input[type="password"] {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.85rem;
  padding: 0.55rem 0.85rem;
  outline: none;
  transition: border-color 0.15s;
}
input[type="password"]:focus { border-color: var(--accent); }
input[type="password"]::placeholder { color: var(--subtle); }

button {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 0.55rem 1.2rem;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
button:hover { opacity: 0.88; }
button:active { transform: scale(0.97); }

.error {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--red);
  margin-top: 0.6rem;
  display: none;
}

.stats {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.stat {
  flex: 1; padding: 1rem;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-n {
  font-size: 1.2rem; font-weight: 600; letter-spacing: -0.02em;
  display: block;
}
.stat-l { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }

footer {
  padding: 1.5rem 2rem;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem;
}
.footer-logo { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.footer-logo span { color: var(--accent); }
.footer-copy { font-size: 0.75rem; color: var(--subtle); font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">
    <img src="economicbomb.webp" alt=""> Economic Bomb
  </a>
</nav>

<main>
  <div class="wrap">
    <div class="eyebrow">
      <span class="pulse"></span>
      Maintenance in progress
    </div>
    <h1>We'll be back<br/><em>shortly</em></h1>
    <p class="sub">The dashboard is temporarily offline for scheduled updates.<br/>Bot commands remain fully active in your Discord server.</p>

    <div class="panel">
      <div class="panel-label">Admin access</div>
      <div class="input-row">
        <input type="password" id="pw" placeholder="Enter access code" onkeydown="if(event.key==='Enter')check()"/>
        <button onclick="check()">Enter</button>
      </div>
      <div class="error" id="err">Invalid access code</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-n" id="clock">--:--</span>
        <div class="stat-l">UTC Time</div>
      </div>
      <div class="stat">
        <span class="stat-n" style="color:var(--green)">Active</span>
        <div class="stat-l">Bot Status</div>
      </div>
      <div class="stat">
        <span class="stat-n" style="color:var(--accent)">Soon™</span>
        <div class="stat-l">ETA</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-logo">Economic <span>Bomb</span></div>
  <div class="footer-copy" id="date"></div>
</footer>

<script>
const PASS = 'eb-maint-2026';

function check() {
  if (document.getElementById('pw').value === PASS) {
    sessionStorage.setItem('eb_bypass', '1');
    window.location.href = '/';
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toUTCString().slice(17, 22);
  document.getElementById('date').textContent =
    now.toDateString();
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
